<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Status{% endblock %} · Rewind</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top">
  <div class="brand">REWIND <span>Detected. Stopped. Undone.</span></div>
  <nav>
    <a href="{{ url_for('index') }}" class="{{ 'on' if active == 'status' else '' }}">Status</a>
    <a href="{{ url_for('incidents_page') }}" class="{{ 'on' if active == 'incidents' else '' }}">Incidents</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
